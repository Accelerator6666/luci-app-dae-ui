name: Cleanup merged feature branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-merged-branches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in             "feature/v0.14.1-i18n-zh-hans"             "feature/v0.14.2-archive-upload"
          do
            status="$(curl -sS -o /tmp/delete-ref.json -w '%{http_code}'               -X DELETE               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch")"
            if [ "$status" = "204" ]; then
              echo "Deleted $branch"
            elif [ "$status" = "404" ] || [ "$status" = "422" ]; then
              echo "$branch is already absent"
            else
              cat /tmp/delete-ref.json || true
              echo "Failed to delete $branch (HTTP $status)" >&2
              exit 1
            fi
          done
