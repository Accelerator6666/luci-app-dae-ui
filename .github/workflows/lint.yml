name: lint
on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JSON syntax
        run: |
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('root/usr/share').rglob('*.json'):
              json.loads(p.read_text())
              print('OK', p)
          PY

      - name: JavaScript syntax
        run: |
          find htdocs/luci-static/resources -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

      - name: Shell syntax
        run: |
          find root/etc/init.d root/usr/libexec -type f -print0 2>/dev/null | while IFS= read -r -d '' f; do
            sh -n "$f"
            echo "OK $f"
          done

      - name: Simplified Chinese i18n coverage
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          po_path = Path('po/zh_Hans/dae-ui.po')
          text = po_path.read_text(encoding='utf-8')

          pairs = {}
          current = None
          for line in text.splitlines():
              if line.startswith('msgid "'):
                  current = json.loads(line[len('msgid '):])
              elif line.startswith('msgstr "') and current is not None:
                  value = json.loads(line[len('msgstr '):])
                  if current:
                      pairs[current] = value
                  current = None

          assert pairs, 'Simplified Chinese catalog is empty'
          empty = sorted(k for k, v in pairs.items() if not v)
          assert not empty, f'untranslated zh_Hans msgids: {empty[:20]}'

          required = set()
          pattern = re.compile(r"_\(\s*(['\"])((?:\\.|(?!\1).)*)\1\s*\)", re.S)

          for path in Path('htdocs/luci-static/resources').rglob('*.js'):
              source = path.read_text(encoding='utf-8')
              for m in pattern.finditer(source):
                  value = m.group(2)
                  value = value.replace("\\'", "'").replace('\\"', '"').replace('\\n', '\n')
                  required.add(value)

          menu = json.loads(Path('root/usr/share/luci/menu.d/luci-app-dae-ui.json').read_text())
          for item in menu.values():
              title = item.get('title')
              if title:
                  required.add(title)

          missing = sorted(s for s in required if s not in pairs)
          assert not missing, 'missing zh_Hans translations:\n' + '\n'.join(missing[:50])

          makefile = Path('Makefile').read_text()
          assert 'dae-ui.zh-cn.lmo' in makefile, 'Makefile must install bundled zh-cn LMO catalog'
          assert 'po/zh_Hans/dae-ui.po' in makefile, 'Makefile must compile the zh_Hans PO catalog'

          print(f'OK zh_Hans coverage: {len(required)} frontend/menu strings, {len(pairs)} catalog entries')
          PY

      - name: Feature contract sanity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          backend = Path('root/usr/share/rpcd/ucode/daeui.uc').read_text()
          common = Path('htdocs/luci-static/resources/daeui/common.js').read_text()
          acl = json.loads(Path('root/usr/share/rpcd/acl.d/luci-app-dae-ui.json').read_text())
          menu = json.loads(Path('root/usr/share/luci/menu.d/luci-app-dae-ui.json').read_text())

          write_methods = set(acl['luci-app-dae-ui']['write']['ubus']['luci.daeui'])
          for method, symbol in [
              ('version_import', 'callVersionImport'),
              ('refresh_geodata_pins', 'callRefreshGeodataPins'),
          ]:
              assert f'{method}:' in backend, f'missing backend RPC {method}'
              assert symbol in common, f'missing frontend RPC binding {symbol}'
              assert method in write_methods, f'missing write ACL for {method}'

          assert "return '/tmp/dae-ui-dae-upload.bin';" in backend, 'custom dae import must use the fixed upload path'
          assert "version_import: {\n\t\t\targs: { label: 'string', filename: 'string' }" in backend, 'version_import must accept metadata only, never an arbitrary file path'
          assert "return '/tmp/dae-ui-dae-upload.bin';" in backend, 'archive import must keep the fixed upload path'
          assert "Unsupported archive format; use a raw dae executable, .zip, .tar.gz or .tgz" in backend
          assert "ulimit -f 262144" in backend, 'archive extraction must be size-bounded'
          assert "Uploaded archive contains an unsafe path" in backend, 'archive path traversal guard missing'
          assert 'scripts/fetch-geo-data.sh' in backend
          assert 'raw.githubusercontent.com/daeuniverse/dae/main/scripts/fetch-geo-data.sh' in backend

          flow = menu.get('admin/services/dae-ui/flow-detail')
          assert flow and flow.get('hidden') is True, 'flow detail route must remain hidden/capability-driven'
          assert flow.get('action', {}).get('path') == 'daeui/flow-detail'

          print('OK feature contracts')
          PY

      - name: v0.14.3 stability and editing contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          common = Path('htdocs/luci-static/resources/daeui/common.js').read_text()
          managed = Path('htdocs/luci-static/resources/daeui/managed.js').read_text()
          parser = Path('htdocs/luci-static/resources/daeui/configparse.js').read_text()
          backend = Path('root/usr/share/rpcd/ucode/daeui.uc').read_text()
          settings = Path('htdocs/luci-static/resources/view/daeui/settings.js').read_text()

          assert 'function visiblePoll' in common
          assert "params: [ 'kind', 'body', 'apply', 'revision' ]" in common
          assert 'function rememberError' in common
          assert 'copyRecentErrors' in common

          for rel in [
              'overview.js', 'runtime.js', 'logs.js', 'connections.js',
              'flows.js', 'native-nodes.js', 'runtime-policies.js', 'dns-runtime.js'
          ]:
              text = Path('htdocs/luci-static/resources/view/daeui', rel).read_text()
              assert 'poll.add' in text and 'dae.visiblePoll' in text, f'visibility-aware polling missing from {rel}'

          for symbol in ['splitComment', 'parseTaggedEntries', 'replaceTaggedValue', 'parseGroups', 'replaceGroupFields']:
              assert f'{symbol}:' in parser, f'missing config parser export {symbol}'

          assert 'taggedFieldEditor' in managed
          assert 'groupFieldEditor' in managed
          assert 'revision:(managed && managed.revision)' in managed

          assert 'function file_revision(path)' in backend
          assert 'revision: file_revision(path)' in backend
          assert 'current_revision = file_revision(path)' in backend
          assert 'staged changes were not written' in backend
          assert "revision: 'string'" in backend

          assert 'Recent error diagnostics' in settings
          assert 'RPC arguments, secrets and request bodies are not recorded.' in settings

          print('OK v0.14.3 stability/editor contracts')
          PY

          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('htdocs/luci-static/resources/daeui/configparse.js', 'utf8');
          const parser = Function('baseclass', source)({ extend: value => value });

          const tagged = "# keep\nnode1: 'vless://example/#frag' # inline\nnode2: \"https://example/old\"\n";
          const entries = parser.parseTaggedEntries(tagged);
          if (entries.length !== 2 || entries[0].value !== 'vless://example/#frag')
            throw new Error('quoted # parsing regression');

          const patched = parser.replaceTaggedValue(tagged, 'node1', "vless://example/O'Reilly");
          if (!patched.ok || !patched.text.includes("# inline") || !patched.text.includes("node2: \"https://example/old\""))
            throw new Error('tagged field splice did not preserve unrelated text');

          const groups = [
            "edge {",
            "  filter: name(keyword: 'O\\'Reilly#HK')",
            "  filter: name(regex: '\\\\p{Han}')",
            "  policy: min",
            "  # keep this comment",
            "}",
            "other {",
            "  filter: subtag(foo)",
            "  policy: random",
            "}"
          ].join('\n');

          const parsed = parser.parseGroups(groups);
          if (parsed.length !== 2 || parsed[0].filterValues.length !== 2 || parsed[0].policyValue !== 'min')
            throw new Error('group parser regression');

          const changed = parser.replaceGroupFields(groups, 'edge', {
            policy: 'min_avg10',
            filters: parsed[0].filterValues
          });
          if (!changed.ok || !changed.text.includes('policy: min_avg10') ||
              !changed.text.includes('# keep this comment') || !changed.text.includes('other {'))
            throw new Error('group field splice did not preserve unrelated syntax');

          const refused = parser.replaceGroupFields(groups, 'edge', {
            filters: [ parsed[0].filterValues[0] ]
          });
          if (refused.ok || refused.code !== 'filter-count')
            throw new Error('field mode must refuse structural filter-count changes');

          console.log('OK configparse behavior');
          NODE

      - name: Ucode structural sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('root/usr/share/rpcd/ucode/daeui.uc')
          text = path.read_text()

          assert text.count("'luci.daeui':") == 1, "rpcd object must appear exactly once"
          assert text.rstrip().endswith('};'), "ucode file has trailing or truncated content"
          assert 'new RegExp' not in text, "avoid browser-only RegExp construction in ucode backend"

          stack = []
          state = 'code'
          quote = None
          regex_class = False
          prev_sig = ''
          pairs = {')': '(', '}': '{', ']': '['}

          i = 0
          while i < len(text):
              ch = text[i]
              nx = text[i + 1] if i + 1 < len(text) else ''

              if state == 'line':
                  if ch == '\n':
                      state = 'code'
                  i += 1
                  continue

              if state == 'block':
                  if ch == '*' and nx == '/':
                      state = 'code'
                      i += 2
                  else:
                      i += 1
                  continue

              if state == 'string':
                  if ch == '\\':
                      i += 2
                      continue
                  if ch == quote:
                      state = 'code'
                  i += 1
                  continue

              if state == 'regex':
                  if ch == '\\':
                      i += 2
                      continue
                  if ch == '[':
                      regex_class = True
                  elif ch == ']':
                      regex_class = False
                  elif ch == '/' and not regex_class:
                      state = 'code'
                      i += 1
                      while i < len(text) and text[i] in 'gimsuy':
                          i += 1
                      continue
                  i += 1
                  continue

              if ch == '/' and nx == '/':
                  state = 'line'
                  i += 2
                  continue

              if ch == '/' and nx == '*':
                  state = 'block'
                  i += 2
                  continue

              if ch in ("'", '"'):
                  state = 'string'
                  quote = ch
                  i += 1
                  continue

              if ch == '/' and (not prev_sig or prev_sig in '([=,:!&|?{;'):
                  state = 'regex'
                  regex_class = False
                  i += 1
                  continue

              if ch in '({[':
                  stack.append((ch, i))
              elif ch in ')}]':
                  assert stack and stack[-1][0] == pairs[ch], f"delimiter mismatch at byte {i}"
                  stack.pop()

              if not ch.isspace():
                  prev_sig = ch
              i += 1

          assert state == 'code', f"unterminated lexical state: {state}"
          assert not stack, f"unclosed delimiter: {stack[-1] if stack else None}"
          print('OK', path)
          PY
