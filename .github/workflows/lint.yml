name: lint
on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JSON syntax
        run: |
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('root/usr/share').rglob('*.json'):
              json.loads(p.read_text())
              print('OK', p)
          PY
      - name: JavaScript syntax
        run: |
          find htdocs/luci-static/resources -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done
